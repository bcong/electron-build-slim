name: publish

# Publishes to npm when a GitHub release is published. Uses npm Trusted Publishing (OIDC), so no token or OTP is needed.
# Register this repository and publish.yml under the package's Trusted Publisher settings on npmjs.com.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm test
      - name: Check version matches tag
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm publish --provenance --access public
