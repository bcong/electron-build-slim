name: 버그 신고 / Bug report
description: 빌드가 실패하거나, 줄인 빌드가 다르게 동작할 때
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요? / What happened?
      description: 기대한 동작과 실제 동작
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: 실행한 명령 / Command
      placeholder: npx electron-build-slim --win --x64
      render: shell
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: plan 출력 / Output of `npx electron-build-slim plan`
      render: text
  - type: textarea
    id: log
    attributes:
      label: 오류 로그 / Error log
      description: "[slim] 줄과 electron-builder 오류 부분"
      render: text
  - type: input
    id: versions
    attributes:
      label: 버전 / Versions
      placeholder: "electron-build-slim 0.1.0, electron-builder 26.x, Electron 41, Node 24, Windows 11, npm/yarn/pnpm"
    validations:
      required: true
